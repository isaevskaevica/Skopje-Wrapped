<!doctype html>
<html lang="mk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E12">
  <title>Скопје Wrapped</title>
  <meta name="description" content="Strava за култура во Скопје, со AI другарот Скопи.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- ЕКРАНИ -->
    <main id="view"></main>

    <!-- ДОЛНО МЕНИ -->
    <nav id="tabbar" hidden>
      <a href="#map" data-tab="map"><span class="ti">◎</span><span>Мапа</span></a>
      <a href="#feed" data-tab="feed"><span class="ti">☰</span><span>Фид</span></a>
      <a href="#skopi" data-tab="skopi" class="skopi-tab"><span class="skopi-orb"><img src="icon.svg" alt=""></span><span>Скопи</span></a>
      <a href="#wrapped" data-tab="wrapped"><span class="ti">✦</span><span>Wrapped</span></a>
      <a href="#me" data-tab="me"><span class="ti">●</span><span>Профил</span></a>
    </nav>
  </div>

  <!-- Слоеви (модали) -->
  <div id="sheet" class="sheet" hidden><div class="sheet-card" role="dialog"></div></div>
  <div id="toast" hidden></div>
  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

  <script src="lib/leaflet.js"></script>
  <script src="lib/html5-qrcode.min.js"></script>
  <script src="lib/html2canvas.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
