<!doctype html>
<html lang="mk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E12">
  <title>Скопје Wrapped</title>
  <meta name="description" content="Strava за култура во Скопје, со AI другарот Скопи.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- ЕКРАНИ -->
    <main id="view"></main>

    <!-- ДОЛНО МЕНИ -->
    <nav id="tabbar" hidden></nav>

  <script src="lib/html5-qrcode.min.js"></script>
  <script src="lib/html2canvas.min.js"></script>
  <script src="js/data.js"></script>

  <script src="js/i18n.js"></script>
  <script src="lib/qrcode.js"></script>
  <!-- Опционално: js/config.local.js со window.SKOPI_KEY = "gsk_..." (не оди на GitHub) -->

  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
